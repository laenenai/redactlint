# Toolchain and tasks for a shared laenen-ai module.
#
# Derived from escrow/mise.toml, which is itself deliberately not a copy of
# cas's, and this one is deliberately not a verbatim copy of escrow's for the
# same stated reason: "a task list with dangling entries trains people to
# ignore task lists."
#
# Two things escrow has and this module does not:
#
#   - sqlc, in [tools] and in a `generate` task. This module touches no
#     database and has no queries. A pinned generator for something that does
#     not exist is a pin nobody checks.
#   - a `test-all` that runs more packages than `test`. There are no
#     containers and no databases here, so the two run the same set;
#     `test-all` is kept because `check` depends on it, and because the race
#     detector is worth running over an analyzer that walks shared type
#     information. The race detector is the only difference between them.
#
# One thing this module has and the others do not: `redact`, which runs this
# module's own analyzer. See CHARTER.md for why it is a binary and a task
# rather than a golangci-lint plugin.

[tools]
go            = "1.25.6"
golangci-lint = "2.11.4"
gofumpt       = "0.9.2"

[env]
CGO_ENABLED = "0"

[tasks.fmt]
run = "gofumpt -l -w $(find . -path ./.claude -prune -o -name '*.go' -print)"

[tasks.fmt-check]
run = "test -z \"$(gofumpt -l $(find . -path ./.claude -prune -o -name '*.go' -print))\""

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
description = "Inner loop: no containers, no databases. Skips at run time, never behind a build tag."
# The analyzer's own tests type-check the fixtures in testdata/src with the
# real type checker, so they are not fast the way a pure unit test is. They
# are still the inner loop: nothing external is required.
run = "go test ./... -short -count=1"

[tasks.build]
description = "Proves the shipped binary is cgo-free: inherits CGO_ENABLED=0 from [env]."
run = "go build ./..."

[tasks.test-all]
description = "Full suite. Here that means the same packages under the race detector."
# CGO_ENABLED=1 is set because the race detector needs cgo. Being cgo-free is
# a *release* constraint and is proven by the `build` task, which `check` also
# depends on.
env = { CGO_ENABLED = "1" }
run = "go test ./... -race -count=1"

[tasks.redact]
description = "Report types that hold security-relevant material and do not redact every rendering."
# Run over this module itself. The analyzer has no secrets of its own, so a
# clean run here proves it loads and runs rather than proving anything about
# the code — which is why it is also wired into the other modules, where it
# has something to find.
run = "go run ./cmd/redactlint ./..."

[tasks.api]
description = "Regenerate api.txt, the public-surface golden file the charter requires."
# The golden file is checked by an ordinary test (api_test.go), which is why
# there is no api-check task: `test` and `test-all` already verify it, so the
# check cannot be forgotten. This task only rewrites it, deliberately.
run = "go test . -run TestAPIGolden -update-api"

[tasks.check]
depends = ["fmt-check", "lint", "build", "test-all", "redact"]
